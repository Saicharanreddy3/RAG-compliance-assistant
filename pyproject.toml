[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-compliance-assistant"
version = "1.0.0"
description = "Grounded question answering over compliance documents, with source citations and a frozen regression suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pypdf>=4.0,<6.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
openai = ["openai>=1.30"]
pinecone = ["pinecone>=5.0"]
lambda = ["mangum>=0.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
rag-assistant = "rag_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# B008 is the documented FastAPI dependency-injection idiom; ARG001 is the
# lifespan handler's required `app` parameter.
"src/rag_assistant/api/main.py" = ["B008", "ARG001"]

[tool.coverage.run]
source = ["src/rag_assistant"]
omit = ["*/__init__.py"]
